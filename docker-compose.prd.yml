version: '3.9'

services:
  cantinabackend:
    # Substituir pelo digest de um build novo,
    # sem o arquivo .env.prd incorporado.
    image: ${CANTINA_BACKEND_IMAGE}

    env_file:
      - /opt/cantina/config/backend.env

    environment:
      NODE_ENV: production

    networks:
      - cantina_app_network
      - cantina_db_network

    deploy:
      replicas: 3

      placement:
        constraints:
          - node.role == manager

      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s

      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  cantina_app_network:
    external: true

  cantina_db_network:
    external: true
