version: '3.9'

services:
  db:
    image: postgres:16-bookworm
    restart: always
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cantina -d cantina']
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: cantina
      POSTGRES_USER: cantina
    networks:
      - local-network

  db-migrations:
    image: h1bertobarbosa/cantina-backend-migrations:latest
    env_file:
      - .env.prd
    networks:
      - local-network
    depends_on:
      - db
    command: ['--wait', 'up']
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      placement:
        constraints:
          - node.role == manager

  cantinabackend:
    image: h1bertobarbosa/cantina-backend:latest
    container_name: cantinabackend
    restart: unless-stopped
    env_file: .env.prd
    depends_on:
      - db
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - local-network
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  pgdata:

networks:
  local-network:
    driver: overlay
